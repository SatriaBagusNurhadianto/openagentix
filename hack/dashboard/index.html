<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenAgentix dashboard</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --ink: #1c2330; --muted: #5b6577; --line: #d9dee7; --grid: #e8ebf1;
  --accent: #2a62d8; --bad: #b3261e; --good: #1b7f4b; --warn: #8a5a00;
  --c1: #2a62d8; --c2: #d9730d; --c3: #148a7a; --c4: #a23b9c; --c5: #7a8a1a; --c6: #c0392b;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161d; --card: #1b212b; --ink: #e6eaf1; --muted: #9aa5b8; --line: #2c3544; --grid: #252d3a;
    --accent: #6c9bff; --bad: #ff8a80; --good: #6fd19a; --warn: #f2c14e;
    --c1: #6c9bff; --c2: #f0a24a; --c3: #4fd1bf; --c4: #d58be0; --c5: #bccf4a; --c6: #ff8a7a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
h1 { font-size: 18px; margin: 0; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button, .btn { background: var(--card); color: var(--ink); border: 0; padding: 6px 12px; font: inherit; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.btn { border: 1px solid var(--line); border-radius: 6px; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
.status { color: var(--muted); font-size: 12px; }
main { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 14px; padding: 14px 16px 28px; max-width: 1500px; margin: 0 auto; }
section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px 10px; min-width: 0; }
section.wide { grid-column: 1 / -1; }
h2 { font-size: 14px; margin: 0 0 8px; }
.sub { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
.empty { color: var(--muted); padding: 18px 4px; font-style: italic; }
.err { color: var(--bad); padding: 12px 4px; }
.bars { display: grid; grid-template-columns: minmax(80px, 38%) 1fr auto; gap: 5px 8px; align-items: center; }
.bars .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .t { background: var(--grid); border-radius: 3px; height: 12px; }
.bars .f { height: 100%; border-radius: 3px; background: var(--c1); }
.bars .v { font-variant-numeric: tabular-nums; text-align: right; }
.tiles { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
.tile { border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; min-width: 120px; }
.tile .n { font-size: 20px; font-variant-numeric: tabular-nums; }
.tile .k { color: var(--muted); font-size: 12px; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--muted); font-size: 10px; }
svg.chart .grid { stroke: var(--grid); stroke-width: 1; }
svg.chart .ln { fill: none; stroke-width: 1.8; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-top: 2px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
th { color: var(--muted); font-weight: 600; }
td.up { color: var(--good); } td.down { color: var(--bad); font-weight: 600; }
.cap { margin: 8px 0 0; color: var(--muted); font-size: 11px; word-break: break-word; }
.cap code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.note { color: var(--warn); font-size: 12px; margin: 6px 0 0; }
@media (prefers-reduced-motion: no-preference) { .bars .f { transition: width .25s; } }
</style>
</head>
<body>
<header>
  <h1>OpenAgentix dashboard</h1>
  <div class="controls">
    <span class="seg" role="group" aria-label="Time window">
      <button type="button" data-w="1h" aria-pressed="true">Last 1 h</button>
      <button type="button" data-w="24h" aria-pressed="false">Last 24 h</button>
    </span>
    <button type="button" class="btn" id="refresh">Refresh</button>
    <a id="jaeger" href="#" hidden>Traces (Jaeger)</a>
    <span class="status" id="status" role="status">loading</span>
  </div>
</header>
<main id="panels"></main>

<!-- Every query of the page. hack/dashboard.sh --check runs each one against a Prometheus-compatible API and fails on a query
     error. {{W}} is the selected window (1h or 24h), {{R}} the rate window of the line charts. kind: instant = one value per series
     now; range = a series over the window. -->
<script type="application/json" id="queries">
[
  {"id":"cost","kind":"instant","expr":"sum by (user_id) (increase(agentgateway_gen_ai_client_cost_usd_total[{{W}}]))"},
  {"id":"tokens","kind":"instant","expr":"sum by (user_id, gen_ai_token_type) (increase(agentgateway_gen_ai_client_token_usage_sum[{{W}}]))"},
  {"id":"model_requests","kind":"instant","expr":"sum(increase(agentgateway_requests_total[{{W}}]))"},
  {"id":"model_error_rate","kind":"instant","expr":"(sum(increase(agentgateway_requests_total{status=~\"5..\"}[{{W}}])) or vector(0)) / sum(increase(agentgateway_requests_total[{{W}}]))"},
  {"id":"model_rate","kind":"range","expr":"sum(rate(agentgateway_requests_total[{{R}}]))"},
  {"id":"tools","kind":"instant","expr":"sum by (tool, status) (increase(toolhive_mcp_tool_calls_total[{{W}}]))"},
  {"id":"kb_search","kind":"instant","expr":"sum by (mode, outcome) (increase(openagentix_kb_search_requests_total[{{W}}]))"},
  {"id":"kb_p50","kind":"range","expr":"histogram_quantile(0.5, sum by (le) (rate(openagentix_kb_search_duration_seconds_bucket[{{R}}])))"},
  {"id":"kb_p95","kind":"range","expr":"histogram_quantile(0.95, sum by (le) (rate(openagentix_kb_search_duration_seconds_bucket[{{R}}])))"},
  {"id":"graph_jobs","kind":"instant","expr":"sum by (state) (increase(openagentix_kb_graph_jobs_total[{{W}}]))"},
  {"id":"graph_tokens","kind":"instant","expr":"sum(increase(openagentix_kb_graph_extraction_tokens_total[{{W}}]))"},
  {"id":"graph_pending","kind":"instant","expr":"sum(openagentix_kb_graph_jobs_pending)"},
  {"id":"notify","kind":"instant","expr":"sum by (kind, outcome) (increase(openagentix_notify_sends_total[{{W}}]))"},
  {"id":"up","kind":"instant","expr":"up"}
]
</script>

<script>
"use strict";
// Hand-written, no libraries, no external requests: the page only talks to its own origin (see the Content-Security-Policy
// that hack/dashboard/serve.py sends). It queries the Prometheus-compatible API at api/v1/* of the same origin.
(function () {
  var QUERIES = JSON.parse(document.getElementById("queries").textContent);
  var BYID = {};
  QUERIES.forEach(function (q) { BYID[q.id] = q; });
  var COLORS = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)", "var(--c6)"];
  // The SVG namespace is an identifier, not a URL that is ever requested; it is split so that no page text looks like a link.
  var SVGNS = "ht" + "tp://www.w3.org/2000/svg";
  var state = { w: "1h", results: {} };

  function expand(expr) {
    return expr.split("{{W}}").join(state.w).split("{{R}}").join("5m");
  }

  function api(path, params) {
    var qs = Object.keys(params).map(function (k) { return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]); }).join("&");
    return fetch("api/v1/" + path + "?" + qs, { headers: { "Accept": "application/json" } }).then(function (r) {
      return r.text().then(function (txt) {
        var body;
        try { body = JSON.parse(txt); } catch (e) { throw new Error("HTTP " + r.status + ": not JSON"); }
        if (!r.ok || body.status !== "success") throw new Error(body.error || ("HTTP " + r.status));
        return body.data;
      });
    });
  }

  function run(q) {
    var now = Math.floor(Date.now() / 1000);
    if (q.kind === "range") {
      var secs = state.w === "24h" ? 86400 : 3600;
      return api("query_range", { query: expand(q.expr), start: now - secs, end: now, step: Math.round(secs / 60) });
    }
    return api("query", { query: expand(q.expr), time: now });
  }

  function loadAll() {
    setStatus("loading");
    var jobs = QUERIES.map(function (q) {
      return run(q).then(function (d) { state.results[q.id] = { ok: true, data: d }; },
                         function (e) { state.results[q.id] = { ok: false, error: String(e && e.message || e) }; });
    });
    return Promise.all(jobs).then(function () {
      render();
      var bad = QUERIES.filter(function (q) { return !state.results[q.id].ok; }).length;
      setStatus(bad ? bad + " of " + QUERIES.length + " queries failed" : "updated " + new Date().toLocaleTimeString());
    });
  }

  function setStatus(t) { document.getElementById("status").textContent = t; }

  // ---- DOM helpers ----
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { if (k === "text") e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); });
    (kids || []).forEach(function (c) { e.appendChild(c); });
    return e;
  }
  function svg(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    return e;
  }

  function fmtNum(n, digits) {
    if (!isFinite(n)) return "n/a";
    var a = Math.abs(n);
    if (a >= 1e6) return (n / 1e6).toFixed(2) + " M";
    if (a >= 1e4) return (n / 1e3).toFixed(1) + " k";
    if (a === 0) return "0";
    if (a < 1) return n.toFixed(digits == null ? 3 : digits);
    return n.toFixed(digits == null ? (a < 100 ? 1 : 0) : digits).replace(/\.0$/, "");
  }
  function fmtUSD(n) { return "$" + (Math.abs(n) < 1 ? n.toFixed(4) : n.toFixed(2)); }
  function fmtSecs(s) { return s < 1 ? Math.round(s * 1000) + " ms" : s.toFixed(2) + " s"; }

  // A result is either explicit "no data yet", an error line, or a usable list of series.
  function vec(id) {
    var r = state.results[id];
    if (!r) return { state: "empty" };
    if (!r.ok) return { state: "error", error: r.error };
    var res = (r.data && r.data.result) || [];
    var out = [];
    res.forEach(function (s) {
      var v = r.data.resultType === "vector" ? parseFloat(s.value && s.value[1]) : null;
      if (r.data.resultType === "vector" && !isFinite(v)) return; // NaN: nothing to show
      out.push({ metric: s.metric || {}, value: v, values: s.values || null });
    });
    return { state: out.length ? "ok" : "empty", series: out, type: r.data && r.data.resultType };
  }

  function note(kind, msg) { return el("div", { "class": kind, text: msg }); }

  function caption(body, expr, extra) {
    var c = el("p", { "class": "cap" }, [el("span", { text: "PromQL: " }), el("code", { text: expr })]);
    body.appendChild(c);
    if (extra) body.appendChild(el("p", { "class": "note", text: extra }));
  }

  function panel(host, title, sub) {
    var s = el("section");
    s.appendChild(el("h2", { text: title }));
    if (sub) s.appendChild(el("p", { "class": "sub", text: sub }));
    host.appendChild(s);
    return s;
  }

  // horizontal bars: rows = [{label, value}], formatted by fmt
  function bars(rows, fmt) {
    var max = Math.max.apply(null, rows.map(function (r) { return r.value; }).concat([0]));
    var g = el("div", { "class": "bars", role: "table" });
    rows.forEach(function (r, i) {
      var f = el("div", { "class": "f", style: "width:" + (max > 0 ? Math.max(1.5, (r.value / max) * 100) : 0) + "%;background:" + COLORS[(r.color == null ? i : r.color) % COLORS.length] });
      g.appendChild(el("div", { "class": "l", title: r.label, text: r.label }));
      g.appendChild(el("div", { "class": "t" }, [f]));
      g.appendChild(el("div", { "class": "v", text: fmt(r.value) }));
    });
    return g;
  }

  function label(metric, keys) {
    var parts = keys.map(function (k) { return metric[k]; }).filter(function (x) { return x != null && x !== ""; });
    return parts.length ? parts.join(" / ") : "(all)";
  }

  function barPanel(host, title, sub, id, keys, fmt, extra) {
    var s = panel(host, title, sub);
    var v = vec(id);
    if (v.state === "error") s.appendChild(note("err", "query failed: " + v.error));
    else if (v.state === "empty") s.appendChild(note("empty", "no data yet"));
    else {
      var rows = v.series.map(function (x) { return { label: label(x.metric, keys), value: x.value }; });
      rows.sort(function (a, b) { return b.value - a.value; });
      s.appendChild(bars(rows, fmt));
    }
    caption(s, expand(BYID[id].expr), extra);
    return s;
  }

  function tile(n, k) { return el("div", { "class": "tile" }, [el("div", { "class": "n", text: n }), el("div", { "class": "k", text: k })]); }

  function scalarTile(id, k, fmt) {
    var v = vec(id);
    if (v.state === "error") return tile("error", k);
    if (v.state === "empty") return tile("no data yet", k);
    return tile(fmt(v.series[0].value), k);
  }

  // line chart: lines = [{name, points: [[t, v], ...]}], fmt for the y axis
  function lineChart(lines, fmt) {
    var W = 600, H = 170, L = 46, R = 8, T = 8, B = 20;
    var pts = [];
    lines.forEach(function (l) { l.points.forEach(function (p) { pts.push(p); }); });
    var t0 = Math.min.apply(null, pts.map(function (p) { return p[0]; })), t1 = Math.max.apply(null, pts.map(function (p) { return p[0]; }));
    var ymax = Math.max.apply(null, pts.map(function (p) { return p[1]; }).concat([0])) || 1;
    if (t1 === t0) t1 = t0 + 1;
    var x = function (t) { return L + (t - t0) / (t1 - t0) * (W - L - R); };
    var y = function (v) { return T + (1 - v / ymax) * (H - T - B); };
    var s = svg("svg", { "class": "chart", viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "line chart: " + lines.map(function (l) { return l.name; }).join(", ") });
    [0, 0.5, 1].forEach(function (f) {
      var yy = T + (1 - f) * (H - T - B);
      s.appendChild(svg("line", { "class": "grid", x1: L, x2: W - R, y1: yy, y2: yy }));
      var tx = svg("text", { x: L - 4, y: yy + 3, "text-anchor": "end" }); tx.textContent = fmt(ymax * f); s.appendChild(tx);
    });
    [t0, t1].forEach(function (t, i) {
      var tx = svg("text", { x: i ? W - R : L, y: H - 5, "text-anchor": i ? "end" : "start" });
      tx.textContent = new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); s.appendChild(tx);
    });
    lines.forEach(function (l, i) {
      var c = COLORS[i % COLORS.length];
      if (l.points.length === 1) { s.appendChild(svg("circle", { cx: x(l.points[0][0]), cy: y(l.points[0][1]), r: 3, fill: c })); return; }
      s.appendChild(svg("polyline", { "class": "ln", stroke: c, points: l.points.map(function (p) { return x(p[0]).toFixed(1) + "," + y(p[1]).toFixed(1); }).join(" ") }));
    });
    return s;
  }
  function legend(names) {
    return el("div", { "class": "legend" }, names.map(function (n, i) {
      var sw = el("i"); sw.style.background = COLORS[i % COLORS.length];
      return el("span", {}, [sw, document.createTextNode(n)]);
    }));
  }

  // line series from range results; NaN points (no samples in a bucket) are skipped
  function rangeLines(specs) {
    var lines = [], errs = [];
    specs.forEach(function (sp) {
      var v = vec(sp.id);
      if (v.state === "error") { errs.push(v.error); return; }
      (v.series || []).forEach(function (x) {
        var pts = (x.values || []).map(function (p) { return [p[0], parseFloat(p[1])]; }).filter(function (p) { return isFinite(p[1]); });
        if (pts.length) lines.push({ name: sp.name + (Object.keys(x.metric).length ? " " + label(x.metric, Object.keys(x.metric)) : ""), points: pts });
      });
    });
    return { lines: lines, errors: errs };
  }
  function linePanelBody(s, specs, fmt) {
    var r = rangeLines(specs);
    if (r.errors.length) s.appendChild(note("err", "query failed: " + r.errors[0]));
    else if (!r.lines.length) s.appendChild(note("empty", "no data yet"));
    else { s.appendChild(lineChart(r.lines, fmt)); s.appendChild(legend(r.lines.map(function (l) { return l.name; }))); }
  }

  // ---- panels ----
  function render() {
    var host = document.getElementById("panels");
    host.textContent = "";

    barPanel(host, "Cost per agent (USD)", "Model gateway cost by virtual key (the agent), last " + state.w, "cost", ["user_id"], fmtUSD,
      "Known quirk (ADR 0003): when a counter series is new inside the window, VictoriaMetrics counts its first sample as an increase, so a young series overstates cost until it is older than the window.");

    barPanel(host, "Tokens per agent", "Input and output tokens by agent, last " + state.w, "tokens", ["user_id", "gen_ai_token_type"], function (n) { return fmtNum(n, 0); });

    var m = panel(host, "Model requests and errors", "Gateway requests, last " + state.w);
    m.appendChild(el("div", { "class": "tiles" }, [
      scalarTile("model_requests", "requests", function (n) { return fmtNum(n, 0); }),
      scalarTile("model_error_rate", "error rate (5xx)", function (n) { return (n * 100).toFixed(1) + " %"; })
    ]));
    linePanelBody(m, [{ id: "model_rate", name: "requests/s" }], function (n) { return fmtNum(n, 3); });
    caption(m, expand(BYID.model_requests.expr) + "   |   " + expand(BYID.model_error_rate.expr) + "   |   " + expand(BYID.model_rate.expr));

    barPanel(host, "Tool calls by tool and outcome", "vMCP toolhive_mcp_tool_calls_total, last " + state.w, "tools", ["tool", "status"], function (n) { return fmtNum(n, 0); });

    var k = barPanel(host, "Knowledge base searches", "By mode and outcome, last " + state.w, "kb_search", ["mode", "outcome"], function (n) { return fmtNum(n, 0); });
    k.insertBefore(el("p", { "class": "sub", text: "Search latency (seconds, quantiles over the window)" }), k.querySelector(".cap"));
    var lat = el("div");
    linePanelBody(lat, [{ id: "kb_p50", name: "p50" }, { id: "kb_p95", name: "p95" }], fmtSecs);
    k.insertBefore(lat, k.querySelector(".cap"));
    caption(k, expand(BYID.kb_p50.expr) + "   |   " + expand(BYID.kb_p95.expr));

    var g = panel(host, "Graph extraction", "Background jobs of the knowledge graph, last " + state.w);
    g.appendChild(el("div", { "class": "tiles" }, [
      scalarTile("graph_tokens", "extraction tokens", function (n) { return fmtNum(n, 0); }),
      scalarTile("graph_pending", "jobs pending now", function (n) { return fmtNum(n, 0); })
    ]));
    var gj = vec("graph_jobs");
    if (gj.state === "error") g.appendChild(note("err", "query failed: " + gj.error));
    else if (gj.state === "empty") g.appendChild(note("empty", "no data yet"));
    else g.appendChild(bars(gj.series.map(function (x) { return { label: label(x.metric, ["state"]), value: x.value }; }).sort(function (a, b) { return b.value - a.value; }), function (n) { return fmtNum(n, 0); }));
    caption(g, expand(BYID.graph_jobs.expr) + "   |   " + expand(BYID.graph_tokens.expr) + "   |   " + expand(BYID.graph_pending.expr));

    barPanel(host, "Notifications", "Sends by platform kind and outcome, last " + state.w, "notify", ["kind", "outcome"], function (n) { return fmtNum(n, 0); });

    var t = panel(host, "Scrape target health", "Every target the bundled VictoriaMetrics scrapes");
    t.className = "wide";
    var up = vec("up");
    if (up.state === "error") t.appendChild(note("err", "query failed: " + up.error));
    else if (up.state === "empty") t.appendChild(note("empty", "no data yet"));
    else {
      var rows = up.series.slice().sort(function (a, b) { return (a.value - b.value) || String(a.metric.job).localeCompare(String(b.metric.job)); });
      var tb = el("table");
      tb.appendChild(el("thead", {}, [el("tr", {}, ["job", "namespace", "pod", "state"].map(function (h) { return el("th", { text: h }); }))]));
      var body = el("tbody");
      rows.forEach(function (r) {
        body.appendChild(el("tr", {}, [
          el("td", { text: r.metric.job || "" }), el("td", { text: r.metric.namespace || "" }), el("td", { text: r.metric.pod || r.metric.instance || "" }),
          el("td", { "class": r.value === 1 ? "up" : "down", text: r.value === 1 ? "up" : "DOWN" })
        ]));
      });
      tb.appendChild(body);
      t.appendChild(tb);
    }
    caption(t, BYID.up.expr);
  }

  // ---- wiring ----
  Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function (b) {
    b.addEventListener("click", function () {
      state.w = b.getAttribute("data-w");
      Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      loadAll();
    });
  });
  document.getElementById("refresh").addEventListener("click", loadAll);

  fetch("config.json").then(function (r) { return r.ok ? r.json() : {}; }).then(function (c) {
    if (c && typeof c.jaeger === "string" && /^http:\/\/(127\.0\.0\.1|localhost):\d+\/?$/.test(c.jaeger)) {
      var a = document.getElementById("jaeger"); a.href = c.jaeger; a.hidden = false;
    }
  }, function () {});

  loadAll();
  window.__oaDashboard = { state: state, reload: loadAll };
  setInterval(function () { if (!document.hidden) loadAll(); }, 30000);
})();
</script>
</body>
</html>
