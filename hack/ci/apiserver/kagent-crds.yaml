# Stand-ins for kagent's five CRDs, for hack/ci/apiserver-test.sh only. They accept any spec (x-kubernetes-preserve-unknown-fields), so every
# refusal in that test comes from the control plane's guard and not from kagent's schema, and the test needs no kagent checkout. Set
# KAGENT_CRDS_DIR to a kagent checkout's helm/kagent-crds/templates to run the same test against the real schemas (their defaults then
# apply, as on a real cluster). Never applied to a real cluster.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modelconfigs.api.kagent.dev
spec:
  group: api.kagent.dev
  scope: Namespaced
  names: {kind: ModelConfig, listKind: ModelConfigList, plural: modelconfigs, singular: modelconfig}
  versions:
    - name: v1alpha3
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: harnesses.api.kagent.dev
spec:
