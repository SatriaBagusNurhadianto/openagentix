{{- if .Values.mcp.enabled }}
{{- $m := .Values.mcp }}
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPGroup
metadata:
  name: {{ $m.groupName }}
  namespace: {{ $m.namespace }}
  labels: {{- include "oa.labels" . | nindent 4 }}
spec:
  description: Backend MCP servers aggregated by the vMCP
{{- range $s := $m.servers }}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: {{ $s.name }}
  namespace: {{ $m.namespace }}
  labels: {{- include "oa.labels" $ | nindent 4 }}
spec:
  groupRef: {name: {{ $m.groupName }}}
  image: {{ $s.image }}
  transport: {{ default "streamable-http" $s.transport }}
  proxyPort: {{ default 8080 $s.proxyPort }}
  mcpPort: {{ default 8080 $s.port }}
  resources: {{- toYaml (default $m.serverResources $s.resources) | nindent 4 }}
{{- end }}
{{- $ia := $m.virtual.incomingAuth }}
{{- if not (has $ia.type (list "anonymous" "oidc")) }}{{ fail (printf "mcp.virtual.incomingAuth.type must be anonymous or oidc, got %q" $ia.type) }}{{ end }}
{{- $policies := $ia.policies }}
{{- if $ia.toolAccess }}
{{- if ne $ia.type "oidc" }}{{ fail "mcp.virtual.incomingAuth.toolAccess needs type oidc: an anonymous caller has no identity to key on" }}{{ end }}
{{- $policies = list }}
{{- range $r := $ia.toolAccess }}{{ range $t := $r.tools }}
{{- $policies = append $policies (printf "permit(principal, action == Action::\"call_tool\", resource == Tool::%s) when { context[\"claim_actor.ate.dev\"].atespace == %s };" (quote $t) (quote $r.atespace)) }}
{{- end }}{{ end }}
{{- end }}
{{- if eq $ia.type "oidc" }}
---
# Validates the per-actor JWT that Substrate injects (RemoteMCPServer.spec.actorJwt). Issuer, keys and CA come
# from values; nothing is fetched insecurely.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPOIDCConfig
metadata:
  name: {{ $ia.oidc.name }}
  namespace: {{ $m.namespace }}
  labels: {{- include "oa.labels" . | nindent 4 }}
spec:
  type: inline
  inline:
    issuer: {{ $ia.oidc.issuer | quote }}
    jwksUrl: {{ $ia.oidc.jwksUrl | quote }}
    {{- if $ia.oidc.jwksAllowPrivateIP }}
    jwksAllowPrivateIP: true
    {{- end }}
    caBundleRef:
      configMapRef: {name: {{ $ia.oidc.caBundle.configMap | quote }}, key: {{ $ia.oidc.caBundle.key | quote }}}
{{- end }}
---
# incomingAuth is oidc (Substrate actor JWT) by default; Cedar then authorizes the authenticated caller.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: {{ $m.virtual.name }}
  namespace: {{ $m.namespace }}
  labels: {{- include "oa.labels" . | nindent 4 }}
spec:
  groupRef: {name: {{ $m.groupName }}}
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig: {prefixFormat: {{ $m.virtual.prefixFormat | quote }}}
    {{- if $m.virtual.codeMode.enabled }}
    codeMode:
      enabled: true
      stepLimit: {{ $m.virtual.codeMode.stepLimit }}
      parallelMaxConcurrency: {{ $m.virtual.codeMode.parallelMaxConcurrency }}
      toolCallTimeout: {{ $m.virtual.codeMode.toolCallTimeout }}
    {{- end }}
    {{- if and (include "oa.obsOn" .) .Values.observability.audit.enabled }}
    # Audit events: tool name, outcome, caller subject (the actor JWT sub, which carries the session id), sizes.
    # Request and response data are included only when observability.capture.content is true.
    audit:
      enabled: true
      includeRequestData: {{ include "oa.obsCapture" . }}
      includeResponseData: {{ include "oa.obsCapture" . }}
    {{- end }}
  {{- if include "oa.obsOn" . }}
  telemetryConfigRef: {name: openagentix-telemetry}
  {{- end }}
  incomingAuth:
    type: {{ $ia.type }}
    {{- if eq $ia.type "oidc" }}
    oidcConfigRef: {name: {{ $ia.oidc.name }}, audience: {{ $ia.oidc.audience | quote }}}
    {{- end }}
    authzConfig:
      type: inline
      inline:
        policies: {{ toJson $policies }}
  outgoingAuth: {source: discovered}
{{- end }}
