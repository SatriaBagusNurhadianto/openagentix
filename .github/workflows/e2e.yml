name: e2e

# ==========================================================================================================================
#  NOT YET WORKING. SCAFFOLD ONLY.
#  install.sh refuses to start without ANTHROPIC_API_KEY and TELEGRAM_BOT_TOKEN, and no keyless profile exists yet.
#  The job below stops at its first step with that message on purpose, so it can never show a green check it has not earned.
#  What has to change, and what the install costs on a 4 vCPU / 16 GB runner: hack/ci/E2E-PLAN.md.
#  To switch it on once the plan is done: set the repository variable E2E_READY=true (and E2E_NIGHTLY=true for the schedule).
# ==========================================================================================================================
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'   # nightly; the job is skipped unless the repository variable E2E_NIGHTLY is 'true'

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || vars.E2E_NIGHTLY == 'true'
    runs-on: ubuntu-24.04          # 4 vCPU / 16 GB for public repositories
    timeout-minutes: 60
    steps:
      - name: guard, NOT YET WORKING
        env:
          READY: ${{ vars.E2E_READY }}
        run: |
          if [ "$READY" != "true" ]; then
            echo "::error title=e2e is not built yet::install.sh needs ANTHROPIC_API_KEY and TELEGRAM_BOT_TOKEN and there is no keyless profile yet. See hack/ci/E2E-PLAN.md."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.0
      - run: hack/ci/install-tools.sh yq kind
      # ---- everything below is the PLAN, unproven: it assumes the install.sh changes listed in hack/ci/E2E-PLAN.md ----
      - name: install (keyless profile, stub model, no Telegram)
        env:
          E2E_PROFILE: ci             # does not exist yet
        run: ./install.sh
      - name: smoke test, the stub agent answers an A2A message
        run: |
          echo "not written yet, see hack/ci/E2E-PLAN.md (Smoke test)"
          exit 1
      - name: diagnostics
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
