# Benchmark agents for the kagent-versus-AX runtime comparison. Adds TWO kagent agents next to the existing `assistant`
# and leaves `assistant` exactly as components/notify/demo-values.yaml defines it.
#
#   bench-lean   memory OFF, knowledge OFF, notify OFF, only the OSV tool the old comparison used (osv_query_vulnerability),
#                the canary skill (so group c runs), same model and the same base system prompt as `assistant`. The chart appends
#                the memory / knowledge / notify paragraphs only for agents that switch those on, so this agent gets none of them.
#   bench-nomem  identical to `assistant` in every respect (tools, skill, knowledge, notify, prompt) except memory OFF.
#
# Helm REPLACES lists across values files, and `agents` is a list: this file must restate the complete `assistant` entry. The copy
# below is components/notify/demo-values.yaml's, line for line (that file is the last one that defines the list today). If that
# entry changes, change it here too: components/bench/check-values.sh renders the chart with and without this file and fails
# when the rendered `assistant` objects differ.
#
# Expected VALUES_FILE order (this file LAST, because it carries the final `agents` list):
#   VALUES_FILE="components/channels/demo-values.yaml components/schedules/demo-values.yaml components/notify/demo-values.yaml \
#                components/observability/demo-values.yaml components/knowledge/graph-demo-values.yaml components/bench/bench-values.yaml" ./install.sh
# (plus the same TELEGRAM_* / NOTIFY_* variables the notify demo needs). Use the SAME files you already installed with, then this one.
#
# Gateway keys and budgets: the chart renders ONE AgentgatewayPolicy for the whole gateway with a local rate limit keyed by
# `apiKey.user_id` (charts/openagentix/templates/gateway.yaml), so every virtual key is its own bucket of gateway.policy.tokenBudget
# (default 1,000,000 tokens per hour). install.sh creates one key per `agents` entry (Secret <name>-virtual-key in the kagent
# namespace), so bench-lean and bench-nomem get their OWN key and their own bucket, and neither spends `assistant`'s. The memory
# embeddings / summaries of an agent with memory ON go through the separate `memory` key, not the agent's key.
#
# Each new agent builds a golden snapshot on first use (1 to 2 minutes) and shares the single kagent-default worker with `assistant`.
agents:
  - name: assistant
    description: General assistant reachable from messaging channels
    model: claude-haiku
    modelConfigName: gateway-claude-haiku
    systemPrompt: |
      You are a concise, helpful assistant running on a Kubernetes-native agent
      platform. Answers are read in a chat app, so keep them short and use plain text.
      Use the available tools when they help; say when you used one.
    tools:
      - tools: [execute_tool_script, fetch_fetch, osv_get_vulnerability, osv_query_vulnerabilities_batch, osv_query_vulnerability]
    skills: [openagentix-canary]
    knowledge: true
    notify: {enabled: true}              # the only difference: adds delivery_notify_send and delivery_notify_list_destinations
    memory:
      enabled: true
      ttlDays: 30

  - name: bench-lean
    description: Benchmark agent, no memory, knowledge or notify, one OSV tool
    model: claude-haiku
    systemPrompt: |
      You are a concise, helpful assistant running on a Kubernetes-native agent
      platform. Answers are read in a chat app, so keep them short and use plain text.
      Use the available tools when they help; say when you used one.
    tools:
      - tools: [osv_query_vulnerability]
    skills: [openagentix-canary]
    knowledge: false
    memory:
      enabled: false

  - name: bench-nomem
    description: Benchmark agent, the assistant without memory
    model: claude-haiku
    systemPrompt: |
      You are a concise, helpful assistant running on a Kubernetes-native agent
      platform. Answers are read in a chat app, so keep them short and use plain text.
      Use the available tools when they help; say when you used one.
    tools:
      - tools: [execute_tool_script, fetch_fetch, osv_get_vulnerability, osv_query_vulnerabilities_batch, osv_query_vulnerability]
    skills: [openagentix-canary]
    knowledge: true
    notify: {enabled: true}
    memory:
      enabled: false
