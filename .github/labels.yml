# Source of truth for repository labels. Apply with: gh label create "<name>" --color <color> --description "<text>" --force (see docs/contributing/workflow.md).
- name: "kind/bug"
  color: "d73a4a"
  description: "Something does not work as documented"
- name: "kind/feature"
  color: "a2eeef"
  description: "New capability or improvement"
- name: "kind/design"
  color: "5319e7"
  description: "Needs or is a design decision (an ADR)"
- name: "kind/docs"
  color: "0075ca"
  description: "Documentation only"
- name: "kind/test"
  color: "fbca04"
  description: "Tests, test tooling or test coverage"
- name: "kind/chore"
  color: "cfd3d7"
  description: "Maintenance, tooling, dependencies, repository hygiene"
- name: "kind/security-hardening"
  color: "b60205"
  description: "Non-sensitive hardening; vulnerabilities go to private reporting"
- name: "area/control-plane"
  color: "1d76db"
  description: "Resource kinds, controller, policy (services/control-plane)"
- name: "area/console"
  color: "1d76db"
  description: "Web console and its API (console, services/console)"
- name: "area/runtime"
  color: "1d76db"
  description: "Agent runtime and sandbox (kagent, Substrate)"
- name: "area/model-gateway"
  color: "1d76db"
  description: "Model gateway, keys, routing"
- name: "area/tools"
  color: "1d76db"
  description: "MCP tool layer, tool servers, skills"
- name: "area/knowledge"
  color: "1d76db"
  description: "Knowledge base and knowledge graph"
- name: "area/memory"
  color: "1d76db"
  description: "Long-term memory"
- name: "area/channels"
  color: "1d76db"
  description: "Chat channels, webhooks, notify"
- name: "area/schedules"
  color: "1d76db"
  description: "Scheduled runs"
- name: "area/governance"
  color: "1d76db"
  description: "A2A gate, tool profiles, egress, policy"
- name: "area/observability"
  color: "1d76db"
  description: "Metrics, traces, cost, audit"
- name: "area/install"
  color: "1d76db"
  description: "Installer, Helm chart, supported clusters"
- name: "area/ci"
  color: "1d76db"
  description: "CI, release and supply chain"
- name: "area/docs"
  color: "1d76db"
  description: "Documentation and website"
- name: "area/community"
  color: "1d76db"
  description: "Contributor experience, process, governance"
- name: "priority/p0"
  color: "b60205"
  description: "Blocks the current release or adoption"
- name: "priority/p1"
  color: "d93f0b"
  description: "Planned for the milestone"
- name: "priority/p2"
  color: "fef2c0"
  description: "Useful, can wait"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers: small, self-contained, with pointers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed; open to outside contributors"
- name: "status/needs-triage"
  color: "ededed"
  description: "A maintainer has not looked at this yet"
- name: "status/needs-design"
  color: "c5def5"
  description: "Needs a design decision before work starts"
- name: "status/blocked"
  color: "000000"
  description: "Waiting on something else"
- name: "status/accepted"
  color: "0e8a16"
  description: "Accepted by a maintainer; ready to be worked on"
- name: "adapter"
  color: "bfd4f2"
  description: "A place where an outside contributor can add an integration"
