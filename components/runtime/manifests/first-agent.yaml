apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata: {name: my-first-harness, namespace: kagent}
spec:
  kagent: {}
  workload:
    # golang-adk digest pinned for kagent 1.0.1 (docs show the 1.0.0 digest)
    image: ghcr.io/kagent-dev/kagent/golang-adk@sha256:d3b1151d39c529a6f921a58a995ff699963012001d2e5075f69bf613abebc24d
  substrate:
    workerPoolRef: {name: kagent-default}
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata: {name: my-first-template, namespace: kagent}
spec:
  description: My first kagent agent
  modelConfig: {name: default-model-config}
  systemPrompt: You are a concise, helpful assistant.
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata: {name: my-first-agent, namespace: kagent}
spec:
  template: {ref: {name: my-first-template}}
  harnessRef: {name: my-first-harness}
