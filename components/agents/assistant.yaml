# Demo agent backed by Claude Haiku through the model gateway. The agent holds only a
# gateway virtual key; the Anthropic key lives in agentgateway-system/anthropic-api-key.
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata: {name: gateway-claude-haiku, namespace: kagent}
spec:
  provider: OpenAI
  model: claude-haiku
  apiKeySecret: gateway-virtual-key
  apiKeySecretKey: OPENAI_API_KEY
  stream: false
  openAI: {baseUrl: "http://model-gateway.agentgateway-system.svc.cluster.local/v1"}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata: {name: assistant-harness, namespace: kagent}
spec:
  kagent: {}
  workload:
    image: ghcr.io/kagent-dev/kagent/golang-adk@sha256:d3b1151d39c529a6f921a58a995ff699963012001d2e5075f69bf613abebc24d
  substrate:
    workerPoolRef: {name: kagent-default}
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata: {name: assistant-template, namespace: kagent}
spec:
  description: General assistant reachable from messaging channels
  modelConfig: {name: gateway-claude-haiku}
  systemPrompt: |
    You are a concise, helpful assistant running on a Kubernetes-native agent
    platform. Answers are read in a chat app, so keep them short and use plain text.
    Use the available tools when they help; say when you used one.
  # MCP tools come from the ToolHive virtual MCP server (fetch + OSV, code mode).
  tools:
  - mcp:
      server: {kind: RemoteMCPServer, name: toolhive-vmcp}
      tools: [execute_tool_script, fetch_fetch, osv_get_vulnerability, osv_query_vulnerabilities_batch, osv_query_vulnerability]
  # Agent Skills are delivered as digest-pinned OCI artifacts.
  skills:
  - name: openagentix-canary
    source:
      oci: 172.18.0.2:5000/skills/openagentix-canary@sha256:d9ce280e02bd6a36c31fb498bdcc3d4234dd0d2aae23b10275bd770b56bce2f8
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata: {name: assistant, namespace: kagent}
spec:
  template: {ref: {name: assistant-template}}
  harnessRef: {name: assistant-harness}
